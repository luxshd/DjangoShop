
<div class="col-md-4">
    <div class="card" style="width: 18rem;">
        {% if book.image %}
            <img class="card-img-top" src="{{ book.image.url }}" alt="Card image cap">
        {% endif %}
      <div class="card-body">
        <h5 class="card-title">{{ book.title|upper}}</h5>
{#        <p class="card-text">{{ book.description }}</p>#}
        <p>{{ book.price }}</p>
        <a href="{% url 'book_detail' book.pk %}" class="btn btn-primary">Детальнее</a>
      </div>
    </div>
</div>
