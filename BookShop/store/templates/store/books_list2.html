<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>

<h1>Books</h1>

<ul>
    {% for book in books %}
    <li>
        {{ book.title }}
        - {{ book.price }} UAH ({{ book.category.name }})
    </li>
    {% empty %}
        <li>No books found</li>
    {% endfor %}
</ul>

</body>
</html>
